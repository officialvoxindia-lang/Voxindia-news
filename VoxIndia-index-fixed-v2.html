<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090f">
<meta name="description" content="VoxIndia - News, Shorts and full videos">
<link rel="manifest" href="./manifest.json">
<title>VoxIndia</title>
<style>
:root{color-scheme:dark;--bg:#09090f;--panel:#15151f;--panel2:#222230;--line:#30303d;--purple:#9b5cff;--text:#f5f5f7;--muted:#aaa;--danger:#ff6868;--good:#9be7ad}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}button:disabled{opacity:.55;cursor:not-allowed}
header{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:#11111a;border-bottom:1px solid #292936;position:sticky;top:0;z-index:6}
.logo{font-size:23px;font-weight:800;color:#b78aff}.logo span{color:white}
header button{background:transparent;color:white;font-size:22px;padding:8px}
#app{max-width:680px;margin:auto}
.topics{display:flex;gap:9px;overflow-x:auto;padding:12px;scrollbar-width:none}.topics::-webkit-scrollbar{display:none}
.topic{white-space:nowrap;border-radius:20px;padding:8px 14px;background:var(--panel2);color:white}.topic.active{background:var(--purple)}
#feed{padding:12px;min-height:45vh}
.news-card,.video-card{background:var(--panel);border:1px solid #292936;border-radius:18px;padding:16px;margin-bottom:14px;overflow:hidden}
.news-meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-bottom:12px}
.breaking{color:#ff6262;font-weight:bold}
.news-card h2{font-size:21px;line-height:1.35;margin-bottom:12px;overflow-wrap:anywhere}
.news-card p{font-size:16px;line-height:1.6;color:#ddd;white-space:pre-wrap;overflow-wrap:anywhere}
.full-text{display:none;margin-top:12px;padding-top:12px;border-top:1px solid #333}
.news-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.news-actions button,.secondary{background:#252532;color:white;border-radius:10px;padding:9px 11px}
.news-actions button.active{color:#c49cff}
.primary{background:var(--purple);color:white;padding:12px 16px;border-radius:10px;width:100%;margin-top:8px}
.secondary{width:100%;margin-top:8px}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.notice{padding:12px;border-radius:10px;margin:10px 0;background:#252532;color:#ddd;overflow-wrap:anywhere}
.error{color:#ff9b9b}.success{color:var(--good)}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:flex-end;justify-content:center}
.modal-box{background:#171722;width:100%;max-width:680px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom))}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.modal-head button{background:none;color:white;font-size:27px;padding:0 5px}
.modal-box h3{font-size:16px;margin:16px 0 7px}
input,textarea,select{width:100%;background:#252532;color:white;border:1px solid #3a3a49;border-radius:10px;padding:12px;margin:7px 0}
textarea{min-height:100px;resize:vertical}
.comment{padding:12px;background:#242430;border-radius:10px;margin:8px 0;overflow-wrap:anywhere}.comment small{color:#aaa}
#accountInfo{color:#aaa;font-size:13px;margin:8px 0;overflow-wrap:anywhere}
nav{position:fixed;bottom:0;left:0;right:0;background:#11111a;border-top:1px solid #292936;display:flex;justify-content:space-around;padding:8px 2px calc(8px + env(safe-area-inset-bottom));z-index:8}
nav button{background:none;color:#ccc;font-size:11px;min-width:0;flex:1;padding:2px}nav button.active{color:#c49cff}nav button span{display:block;font-size:20px;margin-bottom:3px}
.video-frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin:10px 0}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-placeholder{display:flex;align-items:center;justify-content:center;min-height:150px;background:#08080c;color:#bbb;border-radius:12px;margin:10px 0;text-align:center;padding:20px}
.shorts-page{padding:0!important;height:calc(100dvh - 126px);overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.short-item{height:calc(100dvh - 126px);min-height:420px;scroll-snap-align:start;position:relative;background:#000;display:flex;flex-direction:column;justify-content:center;overflow:hidden;margin:0 0 8px;border-radius:14px}
.short-player{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.short-overlay{position:absolute;left:0;right:0;bottom:0;padding:60px 14px 16px;background:linear-gradient(transparent,rgba(0,0,0,.9));pointer-events:none}
.short-overlay h2{font-size:19px;line-height:1.3;margin-bottom:7px;text-shadow:0 1px 3px #000}
.short-overlay p{font-size:13px;color:#eee;line-height:1.4;max-height:56px;overflow:hidden}
.short-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;pointer-events:auto}
.short-actions button{background:#252532dd;color:white;padding:8px 10px;border-radius:9px}
.short-hint{position:absolute;top:12px;left:12px;background:#0009;padding:7px 10px;border-radius:20px;font-size:12px;z-index:2}
.profile-row{display:flex;align-items:center;gap:12px;margin:10px 0 16px}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#333}
@media(min-width:700px){.short-item{height:calc(100vh - 150px);max-width:430px;margin:0 auto 12px}.shorts-page{height:calc(100vh - 150px)}}
</style>
</head>
<body>
<header><div class="logo">Vox<span>India</span></div><button aria-label="Account" onclick="openAccount()">👤</button></header>
<div id="app">
 <div class="topics" id="topics">
  <button class="topic active" data-category="All">All</button><button class="topic" data-category="India">India</button><button class="topic" data-category="World">World</button><button class="topic" data-category="Politics">Politics</button><button class="topic" data-category="Business">Business</button><button class="topic" data-category="Technology">Technology</button><button class="topic" data-category="Sports">Sports</button><button class="topic" data-category="Entertainment">Entertainment</button>
 </div>

</div>
<nav aria-label="Main navigation">
 <button data-view="feed" class="active" onclick="showFeed()"><span>🏠</span><b data-i18n="home">होम</b></button>
 <button data-view="shorts" onclick="showShorts()"><span>▶️</span><b>Shorts</b></button>
 <button data-view="videos" onclick="showVideos()"><span>🎬</span><b data-i18n="videos">पूरे वीडियो</b></button>

</nav>

<div class="modal" id="accountModal"><div class="modal-box">
 <div class="modal-head"><h2 data-i18n="account">अकाउंट</h2><button onclick="closeModal('accountModal')">×</button></div>
 <div class="profile-row"><img id="profilePhoto" class="avatar" alt="Profile photo" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="><div><strong id="profileName">VoxIndia User</strong><div id="accountInfo">लॉगिन नहीं है</div></div></div>
 <button class="primary" id="loginBtn" onclick="loginGoogle()">Google से लॉगिन करें</button>
 <div id="signedInOptions" style="display:none"><h3 data-i18n="editProfile">प्रोफाइल बदलें</h3><input id="profileNameInput" maxlength="60" placeholder="प्रोफाइल नाम"><button class="secondary" onclick="saveProfile()" data-i18n="saveProfile">प्रोफाइल सेव करें</button><button class="secondary" onclick="showTopics()" data-i18n="manageTopics">पसंदीदा टॉपिक</button><button class="secondary" onclick="logout()" data-i18n="logout">लॉगआउट</button></div>
 <h3 data-i18n="changeLanguage">भाषा बदलें</h3><button class="secondary" onclick="chooseLanguage('hi')">हिन्दी</button><button class="secondary" onclick="chooseLanguage('en')">English</button>
 <button class="secondary" onclick="closeModal('accountModal')" data-i18n="close">बंद करें</button>
</div></div>
<div class="modal" id="commentsModal"><div class="modal-box"><div class="modal-head"><h2 data-i18n="comments">कमेंट</h2><button onclick="closeModal('commentsModal')">×</button></div><div id="commentsList"></div><form id="commentForm"><textarea id="commentText" placeholder="अपना कमेंट लिखें..." required maxlength="1000"></textarea><button class="primary" type="submit" data-i18n="sendComment">कमेंट भेजें</button></form></div></div>
<div class="modal" id="topicsModal"><div class="modal-box"><div class="modal-head"><h2 data-i18n="followTopics">टॉपिक चुनें</h2><button onclick="closeModal('topicsModal')">×</button></div><div id="topicsChoices"></div><button class="primary" onclick="saveTopics()" data-i18n="saveTopics">टॉपिक सेव करें</button></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,getDocs,addDoc,doc,setDoc,deleteDoc,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,updateProfile} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig={apiKey:"AIzaSyBLRtN-Q15B0EeXfe4gyu50YZTGull-kzU",authDomain:"voxindia-77b87.firebaseapp.com",projectId:"voxindia-77b87",storageBucket:"voxindia-77b87.firebasestorage.app",messagingSenderId:"475424283766",appId:"1:475424283766:web:d86af5966be9578f3d9357",measurementId:"G-2HZL7BG9FG"};
const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app),provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});
const $=id=>document.getElementById(id);
const categories=["India","World","Politics","Business","Technology","Sports","Entertainment"];
const translations={
en:{home:"Home",videos:"Full Videos",saved:"Saved",account:"Account",editProfile:"Edit Profile",saveProfile:"Save Profile",manageTopics:"Manage Followed Topics",logout:"Sign out",close:"Close",comments:"Comments",sendComment:"Send Comment",followTopics:"Follow Topics",saveTopics:"Save Topics",changeLanguage:"Change Language",loading:"Loading news...",noNews:"No news available yet.",noSaved:"No saved news yet.",noShorts:"No Shorts available yet.",noVideos:"No full videos available yet.",loginRequired:"Please sign in to use this feature.",readFull:"Read Full",showLess:"Show Less",like:"♡ Like",liked:"♥ Liked",save:"🔖 Save",savedBtn:"🔖 Saved",share:"↗ Share",comment:"Comment",report:"⚑ Report",breaking:"BREAKING NEWS",notSigned:"Not signed in",signedAs:"Signed in as",reportReason:"Why are you reporting this?",profileSaved:"Profile updated.",topicsSaved:"Topics saved.",commentSent:"Comment sent.",reportSent:"Report submitted.",videoMissing:"Video link is missing or invalid.",writeComment:"Write a comment...",profileName:"Display name"},
hi:{home:"होम",videos:"पूरे वीडियो",saved:"सेव",account:"अकाउंट",editProfile:"प्रोफाइल बदलें",saveProfile:"प्रोफाइल सेव करें",manageTopics:"पसंदीदा टॉपिक",logout:"लॉगआउट",close:"बंद करें",comments:"कमेंट",sendComment:"कमेंट भेजें",followTopics:"टॉपिक चुनें",saveTopics:"टॉपिक सेव करें",changeLanguage:"भाषा बदलें",loading:"न्यूज़ लोड हो रही है...",noNews:"अभी कोई न्यूज़ उपलब्ध नहीं है।",noSaved:"अभी कोई न्यूज़ सेव नहीं है।",noShorts:"अभी कोई Shorts उपलब्ध नहीं है।",noVideos:"अभी कोई पूरा वीडियो उपलब्ध नहीं है।",loginRequired:"इस सुविधा के लिए पहले लॉगिन करें।",readFull:"पूरी खबर पढ़ें",showLess:"कम दिखाएँ",like:"♡ पसंद",liked:"♥ पसंद किया",save:"🔖 सेव करें",savedBtn:"🔖 सेव्ड",share:"↗ शेयर",comment:"कमेंट",report:"⚑ रिपोर्ट",breaking:"ब्रेकिंग न्यूज़",notSigned:"लॉगिन नहीं है",signedAs:"लॉगिन अकाउंट",reportReason:"रिपोर्ट करने का कारण?",profileSaved:"प्रोफाइल अपडेट हो गई।",topicsSaved:"टॉपिक सेव हो गए।",commentSent:"कमेंट भेज दिया गया।",reportSent:"रिपोर्ट भेज दी गई।",videoMissing:"वीडियो लिंक मौजूद नहीं है या सही नहीं है।",writeComment:"अपना कमेंट लिखें...",profileName:"प्रोफाइल नाम"}
};
let language=localStorage.getItem("voxLanguage")==="en"?"en":"hi",user=null,allNews=[],activeCategory="All",currentView="feed",currentCommentNewsId="",savedIds=new Set(),selectedTopics=readArray("voxTopics");
function readArray(k){try{const x=JSON.parse(localStorage.getItem(k)||"[]");return Array.isArray(x)?x:[]}catch{return []}}
function t(k){return translations[language][k]||translations.en[k]||k}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function notice(msg,isError=false){const old=$("notice");if(old)old.remove();const d=document.createElement("div");d.id="notice";d.className="notice "+(isError?"error":"success");d.textContent=msg;$("feed").prepend(d);setTimeout(()=>d.remove(),4000)}
function requireLogin(){if(user)return true;notice(t("loginRequired"),true);$("accountModal").style.display="flex";updateAccount();return false}
function updateLanguage(){document.documentElement.lang=language;document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));$("profileNameInput").placeholder=t("profileName");renderView()}
window.chooseLanguage=lang=>{if(!["hi","en"].includes(lang))return;language=lang;localStorage.setItem("voxLanguage",lang);updateLanguage();$("accountModal").style.display="none"}
window.openAccount=()=>{$("accountModal").style.display="flex";updateAccount()}
window.closeModal=id=>$(id).style.display="none";
function updateAccount(){const signed=!!user;$("accountInfo").textContent=signed?t("signedAs")+" "+(user.email||"") :t("notSigned");$("profileName").textContent=signed?(user.displayName||"VoxIndia User"):"VoxIndia User";$("profilePhoto").src=signed&&user.photoURL?user.photoURL:"data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=";$("profileNameInput").value=signed?(user.displayName||""):"";$("loginBtn").style.display=signed?"none":"block";$("signedInOptions").style.display=signed?"block":"none"}
window.loginGoogle=async()=>{try{await signInWithPopup(auth,provider)}catch(e){notice("Login error: "+(e.code||e.message),true)}};
window.logout=async()=>{try{await signOut(auth);$("accountModal").style.display="none"}catch(e){notice(e.message,true)}};
window.saveProfile=async()=>{if(!requireLogin())return;const name=$("profileNameInput").value.trim();if(!name)return notice(t("profileName"),true);try{await updateProfile(auth.currentUser,{displayName:name});user=auth.currentUser;updateAccount();notice(t("profileSaved"))}catch(e){notice(e.message,true)}};
onAuthStateChanged(auth,async u=>{user=u;updateAccount();await loadSaved();if(currentView==="saved")renderView()});
async function loadSaved(){savedIds.clear();if(!user)return;try{const s=await getDocs(collection(db,"users",user.uid,"savedNews"));s.forEach(d=>savedIds.add(d.id))}catch(e){console.warn("Saved list:",e)}}
function stamp(n){return n?.createdAt?.seconds||n?.createdAt?._seconds||0}
function title(n){return n.title||n.headline||"News"}
function body(n){return n.content||n.text||n.description||""}
function videoURL(n){return n.youtubeUrl||n.youtubeLink||n.videoUrl||n.videoLink||n.youtube||n.video||""}
function videoID(raw){if(!raw||typeof raw!=="string")return "";try{const u=new URL(raw.trim());let id="";if(u.hostname==="youtu.be")id=u.pathname.split("/").filter(Boolean)[0]||"";else if(u.hostname.includes("youtube.com")){if(u.pathname==="/watch")id=u.searchParams.get("v")||"";else if(/^\/(shorts|embed|live)\//.test(u.pathname))id=u.pathname.split("/").filter(Boolean)[1]||""}return /^[A-Za-z0-9_-]{11}$/.test(id)?id:""}catch{return ""}}
function videoType(n){const v=String(n.videoType||n.contentType||n.videoKind||n.format||n.type||"").toLowerCase();if(["short","shorts","reel","reels"].includes(v)||n.isShort===true)return "short";if(["inline","article","news","text","textnews"].includes(v)||n.videoPlacement==="inline"||n.embedInNews===true)return "inline";if(["full","video","long","longvideo"].includes(v)||n.isFullVideo===true)return "full";return videoURL(n)?"full":"text"}
function embed(id,auto=false){return "https://www.youtube.com/embed/"+encodeURIComponent(id)+"?playsinline=1&controls=1&rel=0&autoplay="+(auto?"1":"0")+"&mute="+(auto?"1":"0")+"&origin="+encodeURIComponent(location.origin)}
function frame(id){return id?'<div class="video-frame"><iframe loading="lazy" src="'+embed(id)+'" title="YouTube video" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>':'<div class="video-placeholder">'+esc(t("videoMissing"))+'</div>'}
function filtered(){
  // All/category feed: hide dedicated Shorts and Full Video posts.
  // Inline videos remain attached to their normal text news article.
  let list=allNews.filter(n=>{
    const type=videoType(n);
    return type!=="short";
  });
  if(activeCategory!=="All"){
    list=list.filter(n=>String(n.category||"").toLowerCase()===activeCategory.toLowerCase());
  }
  return list;
}
function actions(n){const liked=readArray("voxLikes").includes(n.id),saved=savedIds.has(n.id);return '<div class="news-actions"><button onclick="likeNews(\''+esc(n.id)+'\')" class="'+(liked?"active":"")+'">'+(liked?t("liked"):t("like"))+'</button><button onclick="saveNews(\''+esc(n.id)+'\')">'+(saved?t("savedBtn"):t("save"))+'</button><button onclick="shareNews(\''+esc(n.id)+'\')">'+t("share")+'</button><button onclick="openComments(\''+esc(n.id)+'\')">'+t("comment")+'</button><button onclick="reportNews(\''+esc(n.id)+'\')">'+t("report")+'</button></div>'}
function card(n){const id=videoID(videoURL(n)),type=videoType(n),inline=type==="inline"&&id;const text=body(n);return '<article class="news-card"><div class="news-meta"><span>'+esc(n.category||"News")+'</span><span class="'+(n.breaking?"breaking":"")+'">'+(n.breaking?t("breaking"):"")+'</span></div><h2>'+esc(title(n))+'</h2><p>'+esc(text.slice(0,260))+'</p>'+(text.length>260?'<div class="full-text" id="full-'+esc(n.id)+'"><p>'+esc(text.slice(260))+'</p></div><button class="secondary" onclick="toggleFull(\''+esc(n.id)+'\')">'+t("readFull")+'</button>':'')+(inline?frame(id):"")+(type==="full"&&id?frame(id):"")+actions(n)+'</article>'}
window.toggleFull=id=>{const e=$("full-"+id);if(!e)return;const open=e.style.display==="block";e.style.display=open?"none":"block";const b=e.nextElementSibling;if(b)b.textContent=open?t("readFull"):t("showLess")};
function renderFeed(){const list=filtered();$("feed").className="";$("feed").innerHTML=list.length?list.map(card).join(""):'<div class="empty">'+t("noNews")+'</div>'}
function stopShorts(){document.querySelectorAll(".short-player").forEach(f=>f.src="about:blank")}
function renderShorts(){const list=allNews.filter(n=>videoType(n)==="short"&&videoID(videoURL(n)));$("topics").style.display="none";$("feed").className="shorts-page";if(!list.length){$("feed").innerHTML='<div class="empty">'+t("noShorts")+'</div>';return}$("feed").innerHTML=list.map(n=>'<section class="short-item" data-id="'+esc(n.id)+'"><div class="short-hint">↑ Swipe</div><iframe class="short-player" loading="lazy" src="'+embed(videoID(videoURL(n)),true)+'" title="Short video" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe><div class="short-overlay"><h2>'+esc(title(n))+'</h2><p>'+esc(body(n))+'</p><div class="short-actions"><button onclick="likeNews(\''+esc(n.id)+'\')">'+t("like")+'</button><button onclick="saveNews(\''+esc(n.id)+'\')">'+t("save")+'</button><button onclick="shareNews(\''+esc(n.id)+'\')">'+t("share")+'</button></div></div></section>').join("")}
function renderVideos(){const list=allNews.filter(n=>videoType(n)==="full"&&videoID(videoURL(n)));$("topics").style.display="none";$("feed").className="";$("feed").innerHTML=list.length?list.map(n=>'<article class="video-card"><h2>'+esc(title(n))+'</h2><p>'+esc(body(n))+'</p>'+frame(videoID(videoURL(n)))+actions(n)+'</article>').join(""):'<div class="empty">'+t("noVideos")+'</div>'}
async function renderSaved(){if(!requireLogin())return;await loadSaved();const list=allNews.filter(n=>savedIds.has(n.id));$("topics").style.display="none";$("feed").className="";$("feed").innerHTML=list.length?list.map(card).join(""):'<div class="empty">'+t("noSaved")+'</div>'}
function renderView(){if(!$("feed"))return;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===currentView));$("topics").style.display=currentView==="feed"?"flex":"none";if(currentView==="feed")renderFeed();else if(currentView==="shorts")renderShorts();else if(currentView==="videos")renderVideos();else if(currentView==="saved")renderSaved()}
window.showFeed=()=>{stopShorts();currentView="feed";renderView()};
window.showShorts=()=>{stopShorts();currentView="shorts";renderView()};
window.showVideos=()=>{stopShorts();currentView="videos";renderView()};
window.showSaved=()=>{stopShorts();currentView="saved";renderView()};
document.querySelectorAll(".topic").forEach(b=>b.addEventListener("click",()=>{activeCategory=b.dataset.category;document.querySelectorAll(".topic").forEach(x=>x.classList.toggle("active",x===b));if(currentView!=="feed")currentView="feed";renderView()}));
window.likeNews=id=>{if(!requireLogin())return;let likes=readArray("voxLikes");likes=likes.includes(id)?likes.filter(x=>x!==id):[...likes,id];localStorage.setItem("voxLikes",JSON.stringify(likes));renderView()};
window.saveNews=async id=>{if(!requireLogin())return;try{const ref=doc(db,"users",user.uid,"savedNews",id);if(savedIds.has(id)){await deleteDoc(ref);savedIds.delete(id)}else{await setDoc(ref,{newsId:id,savedAt:serverTimestamp()});savedIds.add(id)}renderView()}catch(e){notice("Save error: "+e.message,true)}};
window.shareNews=async id=>{const n=allNews.find(x=>x.id===id);if(!n)return;const text=title(n)+"\n"+body(n);try{if(navigator.share)await navigator.share({title:title(n),text});else{await navigator.clipboard.writeText(text);notice("Copied")}}catch(e){if(e.name!=="AbortError")notice(e.message,true)}};
window.openComments=async id=>{if(!requireLogin())return;currentCommentNewsId=id;$("commentsModal").style.display="flex";$("commentsList").innerHTML='<div class="empty">Loading...</div>';try{const s=await getDocs(collection(db,"news",id,"comments"));$("commentsList").innerHTML=s.empty?'<div class="empty">No comments yet.</div>':s.docs.map(d=>{const x=d.data();return '<div class="comment"><strong>'+esc(x.userName||"User")+'</strong><p>'+esc(x.text||"")+'</p></div>'}).join("")}catch(e){$("commentsList").innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}};
$("commentForm").addEventListener("submit",async e=>{e.preventDefault();if(!requireLogin()||!currentCommentNewsId)return;const text=$("commentText").value.trim();if(!text)return;try{await addDoc(collection(db,"news",currentCommentNewsId,"comments"),{text,userId:user.uid,userName:user.displayName||"User",createdAt:serverTimestamp()});$("commentText").value="";$("commentsList").innerHTML+='<div class="comment"><strong>'+esc(user.displayName||"User")+'</strong><p>'+esc(text)+'</p></div>'}catch(err){notice("Comment error: "+err.message,true)}});
window.reportNews=async id=>{if(!requireLogin())return;const reason=prompt(t("reportReason"));if(!reason)return;try{await addDoc(collection(db,"reports"),{newsId:id,reason,userId:user.uid,userEmail:user.email||"",createdAt:serverTimestamp()});notice(t("reportSent"))}catch(e){notice("Report error: "+e.message,true)}};
window.showTopics=()=>{if(!requireLogin())return;$("topicsChoices").innerHTML=categories.map(c=>'<label style="display:block;padding:8px"><input type="checkbox" value="'+c+'" '+(selectedTopics.includes(c)?"checked":"")+'>'+c+'</label>').join("");$("accountModal").style.display="none";$("topicsModal").style.display="flex"};
window.saveTopics=()=>{if(!requireLogin())return;selectedTopics=[...$("topicsChoices").querySelectorAll("input:checked")].map(x=>x.value);localStorage.setItem("voxTopics",JSON.stringify(selectedTopics));$("topicsModal").style.display="none";notice(t("topicsSaved"))};
async function loadNews(){$("feed").innerHTML='<div class="empty">'+t("loading")+'</div>';try{const s=await getDocs(collection(db,"news"));allNews=s.docs.map(d=>({id:d.id,...d.data()})).filter(n=>n.published!==false).sort((a,b)=>stamp(b)-stamp(a));renderView()}catch(e){$("feed").innerHTML='<div class="notice error">News load failed: '+esc(e.message)+'</div>'}}
updateLanguage();loadNews();
</script>
</body>
</html>
