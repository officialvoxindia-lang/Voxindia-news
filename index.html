<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090f">
<meta name="description" content="VoxIndia - News, Shorts and full videos">
<link rel="manifest" href="./manifest.json">
<title>VoxIndia</title>
<style>
:root{color-scheme:dark;--bg:#09090f;--panel:#15151f;--panel2:#20202c;--line:#30303d;--purple:#9b5cff;--text:#f5f5f7;--muted:#aaa;--danger:#ff6868;--good:#9be7ad}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Arial, sans-serif;min-height:100vh;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
button:disabled{opacity:.55;cursor:not-allowed}
header{height:58px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:#11111a;border-bottom:1px solid #292936;position:sticky;top:0;z-index:6}
.logo{font-size:23px;font-weight:800;color:#b78aff}.logo span{color:white}
header button{background:transparent;color:white;font-size:22px;padding:8px}
#app{max-width:680px;margin:auto}
.topics{display:flex;gap:9px;overflow-x:auto;padding:12px;scrollbar-width:none}
.topics::-webkit-scrollbar{display:none}
.topic{white-space:nowrap;border-radius:20px;padding:8px 14px;background:var(--panel2);color:white}
.topic.active{background:var(--purple)}
#feed{padding:12px;min-height:45vh}
.news-card,.video-card{background:var(--panel);border:1px solid #292936;border-radius:18px;padding:16px;margin-bottom:14px;overflow:hidden}
.news-meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin-bottom:12px}
.breaking{color:#ff6262;font-weight:bold}
.news-card h2{font-size:21px;line-height:1.35;margin-bottom:12px;overflow-wrap:anywhere}
.news-card p{font-size:16px;line-height:1.6;color:#ddd;white-space:pre-wrap;overflow-wrap:anywhere}
.full-text{display:none;margin-top:12px;padding-top:12px;border-top:1px solid #333}
.news-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.news-actions button,.secondary{background:#252532;color:white;border-radius:10px;padding:9px 11px}
.news-actions button.active{color:#c49cff}
.primary{background:var(--purple);color:white;padding:12px 16px;border-radius:10px;width:100%;margin-top:8px}
.secondary{width:100%;margin-top:8px}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.notice{padding:12px;border-radius:10px;margin:10px 0;background:#252532;color:#ddd;overflow-wrap:anywhere}
.error{color:#ff9b9b}.success{color:var(--good)}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:flex-end;justify-content:center}
.modal-box{background:#171722;width:100%;max-width:680px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom))}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.modal-head button{background:none;color:white;font-size:27px;padding:0 5px}
.modal-box h3{font-size:16px;margin:16px 0 7px}
.modal-box label{display:block;color:#ddd;margin:9px 0}
input,textarea,select{width:100%;background:#252532;color:white;border:1px solid #3a3a49;border-radius:10px;padding:12px;margin:7px 0}
input[type=checkbox]{width:auto;margin-right:8px}
textarea{min-height:100px;resize:vertical}
.comment{padding:12px;background:#242430;border-radius:10px;margin:8px 0;overflow-wrap:anywhere}
.comment small{color:#aaa}
#accountInfo{color:#aaa;font-size:13px;margin:8px 0;overflow-wrap:anywhere}
nav{position:fixed;bottom:0;left:0;right:0;background:#11111a;border-top:1px solid #292936;display:flex;justify-content:space-around;padding:8px 2px calc(8px + env(safe-area-inset-bottom));z-index:8}
nav button{background:none;color:#ccc;font-size:11px;min-width:0;flex:1;padding:2px}
nav button.active{color:#c49cff}
nav button span{display:block;font-size:20px;margin-bottom:3px}
#languageScreen{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:25px}
#languageScreen h1{font-size:34px;color:var(--purple)}
#languageScreen button{width:220px;padding:14px;border-radius:12px;background:var(--panel);color:white;border:1px solid var(--purple)}
.video-frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin:10px 0}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video-label{font-size:12px;color:var(--muted);margin:5px 0}
.shorts-page{padding:0!important;height:calc(100dvh - 126px);overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.short-item{height:calc(100dvh - 126px);min-height:420px;scroll-snap-align:start;position:relative;background:#000;display:flex;flex-direction:column;justify-content:center;overflow:hidden;margin:0 0 8px;border-radius:14px}
.short-player{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.short-overlay{position:absolute;left:0;right:0;bottom:0;padding:60px 14px 16px;background:linear-gradient(transparent,rgba(0,0,0,.9));pointer-events:none}
.short-overlay h2{font-size:19px;line-height:1.3;margin-bottom:7px;text-shadow:0 1px 3px #000}
.short-overlay p{font-size:13px;color:#eee;line-height:1.4;max-height:56px;overflow:hidden}
.short-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;pointer-events:auto}
.short-actions button{background:#252532dd;color:white;padding:8px 10px;border-radius:9px}
.short-hint{position:absolute;top:12px;left:12px;background:#0009;padding:7px 10px;border-radius:20px;font-size:12px;z-index:2}
.video-placeholder{display:flex;align-items:center;justify-content:center;min-height:150px;background:#08080c;color:#bbb;border-radius:12px;margin:10px 0;text-align:center;padding:20px}
.profile-row{display:flex;align-items:center;gap:12px;margin:10px 0 16px}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#333}
@media(min-width:700px){.short-item{height:calc(100vh - 150px);max-width:430px;margin:0 auto 12px}.shorts-page{height:calc(100vh - 150px)}}
</style>
</head>
<body>
<div id="languageScreen">
  <h1>VoxIndia</h1>
  <p id="languagePrompt">Select your language</p>
  <button onclick="chooseLanguage('hi')">हिन्दी</button>
  <button onclick="chooseLanguage('en')">English</button>
</div>

<header>
  <div class="logo">Vox<span>India</span></div>
  <button aria-label="Account" onclick="openAccount()">👤</button>
</header>

<div id="app">
  <div class="topics" id="topics">
    <button class="topic active" data-category="All">All</button>
    <button class="topic" data-category="India">India</button>
    <button class="topic" data-category="World">World</button>
    <button class="topic" data-category="Politics">Politics</button>
    <button class="topic" data-category="Business">Business</button>
    <button class="topic" data-category="Technology">Technology</button>
    <button class="topic" data-category="Sports">Sports</button>
    <button class="topic" data-category="Entertainment">Entertainment</button>
  </div>
  <main id="feed"><div class="empty" data-i18n="loading">Loading news...</div></main>
</div>

<nav aria-label="Main navigation">
  <button data-view="feed" class="active" onclick="showFeed()"><span>🏠</span><b data-i18n="home">Home</b></button>
  <button data-view="shorts" onclick="showShorts()"><span>▶️</span><b>Shorts</b></button>
  <button data-view="videos" onclick="showVideos()"><span>🎬</span><b data-i18n="videos">Videos</b></button>
  <button data-view="saved" onclick="showSaved()"><span>🔖</span><b data-i18n="saved">Saved</b></button>
  <button data-view="account" onclick="openAccount()"><span>👤</span><b data-i18n="account">Account</b></button>
</nav>

<div class="modal" id="accountModal">
 <div class="modal-box">
  <div class="modal-head"><h2 data-i18n="account">Account</h2><button onclick="closeModal('accountModal')">×</button></div>
  <div class="profile-row"><img id="profilePhoto" class="avatar" alt="Profile photo" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="><div><strong id="profileName">VoxIndia User</strong><div id="accountInfo">Not signed in</div></div></div>
  <button class="primary" id="loginBtn" onclick="loginGoogle()" data-i18n="googleLogin">Sign in with Google</button>
  <div id="signedInOptions" style="display:none">
   <h3 data-i18n="editProfile">Edit Profile</h3>
   <input id="profileNameInput" maxlength="60" placeholder="Display name">
   <button class="secondary" onclick="saveProfile()" data-i18n="saveProfile">Save Profile</button>
   <button class="secondary" onclick="showTopics()" data-i18n="manageTopics">Manage Followed Topics</button>
   <button class="secondary" onclick="showLanguageSettings()" data-i18n="changeLanguage">Change Language</button>
   <button class="secondary" onclick="logout()" data-i18n="logout">Sign out</button>
  </div>
  <div id="signedOutOptions">
   <button class="secondary" onclick="showLanguageSettings()" data-i18n="changeLanguage">Change Language</button>
   <button class="secondary" onclick="showTopics()" data-i18n="manageTopics">Manage Topics</button>
  </div>
  <button class="secondary" onclick="closeModal('accountModal')" data-i18n="close">Close</button>
 </div>
</div>

<div class="modal" id="commentsModal">
 <div class="modal-box">
  <div class="modal-head"><h2 data-i18n="comments">Comments</h2><button onclick="closeModal('commentsModal')">×</button></div>
  <div id="commentsList"></div>
  <form id="commentForm"><textarea id="commentText" data-i18n-placeholder="writeComment" placeholder="Write a comment..." required maxlength="1000"></textarea><button class="primary" type="submit" id="sendCommentBtn" data-i18n="sendComment">Send Comment</button></form>
 </div>
</div>

<div class="modal" id="topicsModal">
 <div class="modal-box">
  <div class="modal-head"><h2 data-i18n="followTopics">Follow Topics</h2><button onclick="closeModal('topicsModal')">×</button></div>
  <div id="topicsChoices"></div>
  <button class="primary" onclick="saveTopics()" data-i18n="saveTopics">Save Topics</button>
 </div>
</div>

<div class="modal" id="languageModal">
 <div class="modal-box">
  <div class="modal-head"><h2 data-i18n="changeLanguage">Change Language</h2><button onclick="closeModal('languageModal')">×</button></div>
  <button class="primary" onclick="chooseLanguage('hi')">हिन्दी</button>
  <button class="primary" onclick="chooseLanguage('en')">English</button>
 </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
 getFirestore,collection,getDocs,addDoc,doc,setDoc,deleteDoc,query,orderBy,serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
 getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig={
 apiKey:"AIzaSyBLRtN-Q15B0EeXfe4gyu50YZTGull-kzU",
 authDomain:"voxindia-77b87.firebaseapp.com",
 projectId:"voxindia-77b87",

 messagingSenderId:"475424283766",
 appId:"1:475424283766:web:d86af5966be9578f3d9357",
 measurementId:"G-2HZL7BG9FG"
};
const firebaseApp=initializeApp(firebaseConfig);
const db=getFirestore(firebaseApp);
const auth=getAuth(firebaseApp);
const provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});

let user=null,allNews=[],activeCategory="All",currentView="feed",currentCommentNewsId="";
let selectedTopics=readJSON("voxTopics",[]);
let language=localStorage.getItem("voxLanguage")||"en";
let savedIds=new Set(),shortObserver=null,shortsScrollHandler=null;
const $=id=>document.getElementById(id);
function readJSON(key,fallback){try{const v=JSON.parse(localStorage.getItem(key)||"null");return Array.isArray(v)?v:fallback}catch{return fallback}}
function t(key){return (translations[language]||translations.en)[key]||(translations.en[key]||key)}
const translations={
 en:{loading:"Loading news...",home:"Home",videos:"Full Videos",saved:"Saved",account:"Account",googleLogin:"Sign in with Google",logout:"Sign out",close:"Close",comments:"Comments",writeComment:"Write a comment...",sendComment:"Send Comment",followTopics:"Follow Topics",saveTopics:"Save Topics",editProfile:"Edit Profile",saveProfile:"Save Profile",manageTopics:"Manage Followed Topics",changeLanguage:"Change Language",notSigned:"Not signed in",signedAs:"Signed in as",noNews:"No news available in this category yet.",noSaved:"No saved news yet.",noShorts:"No Shorts available yet.",noVideos:"No full videos available yet.",loginSave:"Please sign in to save news.",loginComment:"Please sign in to comment.",loginReport:"Please sign in to report news.",readFull:"Read Full",showLess:"Show Less",like:"♡ Like",liked:"♥ Liked",save:"🔖 Save",savedBtn:"🔖 Saved",share:"↗ Share",report:"⚑ Report",languagePrompt:"Select your language",profileName:"Display name",profileSaved:"Profile updated.",topicsSaved:"Topics saved.",commentSent:"Comment sent.",reportSent:"Report submitted.",copied:"News copied to clipboard.",videoUnavailable:"Video link is missing or invalid.",shortHint:"Swipe up for next video",reportReason:"Report reason?" },
 hi:{loading:"न्यूज़ लोड हो रही है...",home:"होम",videos:"पूरे वीडियो",saved:"सेव",account:"अकाउंट",googleLogin:"Google से लॉगिन करें",logout:"लॉगआउट",close:"बंद करें",comments:"कमेंट",writeComment:"अपना कमेंट लिखें...",sendComment:"कमेंट भेजें",followTopics:"टॉपिक चुनें",saveTopics:"टॉपिक सेव करें",editProfile:"प्रोफाइल बदलें",saveProfile:"प्रोफाइल सेव करें",manageTopics:"पसंदीदा टॉपिक",changeLanguage:"भाषा बदलें",notSigned:"लॉगिन नहीं है",signedAs:"लॉगिन अकाउंट",noNews:"इस कैटेगरी में अभी न्यूज़ नहीं है।",noSaved:"अभी कोई न्यूज़ सेव नहीं है।",noShorts:"अभी कोई Shorts उपलब्ध नहीं है।",noVideos:"अभी कोई लंबा वीडियो उपलब्ध नहीं है।",loginSave:"न्यूज़ सेव करने के लिए लॉगिन करें।",loginComment:"कमेंट करने के लिए लॉगिन करें।",loginReport:"रिपोर्ट करने के लिए लॉगिन करें।",readFull:"पूरी खबर पढ़ें",showLess:"कम दिखाएँ",like:"♡ पसंद",liked:"♥ पसंद किया",save:"🔖 सेव करें",savedBtn:"🔖 सेव्ड",share:"↗ शेयर",report:"⚑ रिपोर्ट",languagePrompt:"अपनी भाषा चुनें",profileName:"प्रोफाइल नाम",profileSaved:"प्रोफाइल अपडेट हो गई।",topicsSaved:"टॉपिक सेव हो गए।",commentSent:"कमेंट भेज दिया गया।",reportSent:"रिपोर्ट भेज दी गई।",copied:"न्यूज़ कॉपी हो गई।",videoUnavailable:"वीडियो लिंक मौजूद नहीं है या सही नहीं है।",shortHint:"अगले वीडियो के लिए ऊपर स्वाइप करें",reportReason:"रिपोर्ट का कारण?"}
};
function escapeHTML(value){return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function showNotice(message,type=""){const old=$("globalNotice");if(old)old.remove();const box=document.createElement("div");box.id="globalNotice";box.className="notice "+type;box.textContent=message;$("feed").prepend(box);window.setTimeout(()=>box.remove(),4500)}
function applyLanguage(){document.documentElement.lang=language;document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n)});document.querySelectorAll("[data-i18n-placeholder]").forEach(el=>{el.placeholder=t(el.dataset.i18nPlaceholder)});$("languagePrompt").textContent=t("languagePrompt");$("profileNameInput").placeholder=t("profileName");renderCurrentView()}
window.chooseLanguage=lang=>{if(!["hi","en"].includes(lang))return;language=lang;localStorage.setItem("voxLanguage",lang);$("languageScreen").style.display="none";closeModal("languageModal");applyLanguage()};
if(localStorage.getItem("voxLanguage"))$("languageScreen").style.display="none";
window.showLanguageSettings=()=>{$("languageModal").style.display="flex"};
window.openAccount=()=>{$("accountModal").style.display="flex";updateAccountUI()};
window.closeModal=id=>{const el=$(id);if(el)el.style.display="none";if(id==="commentsModal")currentCommentNewsId="";};
window.loginGoogle=async()=>{try{await signInWithPopup(auth,provider)}catch(err){showNotice("Login error: "+(err.code||err.message),"error")}};
window.logout=async()=>{try{await signOut(auth);closeModal("accountModal")}catch(err){showNotice(err.message,"error")}};
function updateAccountUI(){
 const signed=!!user;
 $("accountInfo").textContent=signed?(t("signedAs")+" "+(user.email||user.displayName||"")):t("notSigned");
 $("profileName").textContent=signed?(user.displayName||"VoxIndia User"):"VoxIndia User";
 $("profilePhoto").src=(signed&&user.photoURL)?user.photoURL:"data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=";
 $("profileNameInput").value=signed?(user.displayName||""):"";
 $("loginBtn").style.display=signed?"none":"block";
 $("signedInOptions").style.display=signed?"block":"none";
 $("signedOutOptions").style.display=signed?"none":"block";
}
window.saveProfile=async()=>{if(!user){showNotice(t("notSigned"),"error");return}const name=$("profileNameInput").value.trim();if(!name){showNotice(t("profileName"),"error");return}try{await updateProfile(auth.currentUser,{displayName:name});user=auth.currentUser;updateAccountUI();showNotice(t("profileSaved"),"success")}catch(err){showNotice("Profile update failed: "+err.message,"error")}};
onAuthStateChanged(auth,async currentUser=>{user=currentUser;updateAccountUI();if(user)await loadSaved();else savedIds.clear();if(currentView==="feed")renderNews()});

async function loadSaved(){savedIds.clear();if(!user)return;try{const snap=await getDocs(collection(db,"users",user.uid,"savedNews"));snap.forEach(item=>savedIds.add(item.id))}catch(err){console.error("Saved news load error:",err)}}
async function loadNews(){
 $("feed").innerHTML='<div class="empty">'+escapeHTML(t("loading"))+'</div>';
 try{const snap=await getDocs(collection(db,"news"));allNews=snap.docs.map(d=>({id:d.id,...d.data()})).filter(n=>n.published!==false).sort((a,b)=>timestamp(b)-timestamp(a));renderCurrentView()}
 catch(err){$("feed").innerHTML='<div class="notice error">News load failed: '+escapeHTML(err.message)+'</div>'}
}
function timestamp(n){return n?.createdAt?.seconds||n?.createdAt?._seconds||0}
function getTitle(n){return n.title||n.headline||"News"}
function getBody(n){return n.content||n.text||n.description||""}
function getVideoUrl(n){return n.youtubeUrl||n.youtubeLink||n.videoUrl||n.videoLink||n.youtube||n.video||""}
function getVideoId(raw){
 if(!raw||typeof raw!=="string")return "";
 try{
  const u=new URL(raw.trim());
  let id="";
  if(u.hostname==="youtu.be"||u.hostname.endsWith(".youtu.be"))id=u.pathname.split("/").filter(Boolean)[0]||"";
  else if(u.hostname.includes("youtube.com")){
   if(u.pathname==="/watch")id=u.searchParams.get("v")||"";
   else if(u.pathname.startsWith("/shorts/")||u.pathname.startsWith("/embed/")||u.pathname.startsWith("/live/"))id=u.pathname.split("/").filter(Boolean)[1]||"";
  }
  return /^[A-Za-z0-9_-]{11}$/.test(id)?id:"";
 }catch{return ""}
}
function getVideoType(n){
 const value=String(n.videoType||n.contentType||n.videoKind||n.format||n.type||"").toLowerCase();
 if(["short","shorts","reel","reels"].includes(value))return "short";
 if(["article","news","inline","text","textnews"].includes(value))return "inline";
 if(["full","video","long","longvideo"].includes(value))return "full";
 if(n.isShort===true||n.isShort==="true")return "short";
 if(n.isFullVideo===true||n.isFullVideo==="true")return "full";
 return getVideoUrl(n)?"full":"none";
}
function videoEmbed(id,autoplay=false){return "https://www.youtube-nocookie.com/embed/"+encodeURIComponent(id)+"?playsinline=1&rel=0&modestbranding=1&autoplay="+(autoplay?"1":"0")+"&mute="+(autoplay?"1":"0")}
function makeVideoFrame(id,label=""){
 if(!id)return '<div class="video-placeholder">'+escapeHTML(t("videoUnavailable"))+'</div>';
 return '<div class="video-frame"><iframe src="'+videoEmbed(id,fa
